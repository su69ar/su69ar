name: 🐍 Generate Contribution Snake

on:
  # jalan otomatis 2x sehari
  schedule:
    - cron: "0 */12 * * *"
  # bisa dijalankan manual
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # biar bisa push hasil build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG/GIF
        uses: Platane/snk@v3
        with:
          github_user_name: su69ar   # ganti kalau beda
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif

      - name: Push to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
